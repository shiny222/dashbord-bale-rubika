# ─────────────────────────────────────────────────────────────
# Nginx reverse proxy for the Telegram Bot Dashboard.
#
# Install (Debian/Ubuntu):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-dashboard.conf /etc/nginx/sites-available/dashboard
#   sudo ln -s /etc/nginx/sites-available/dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d dashboard.example.com   # or configure a
#                                                   # real certificate
# The Node.js app binds to 127.0.0.1:3000 and is NEVER exposed
# directly to the network.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name dashboard.example.com;

    # Redirect all plain HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.example.com;

    # Replace with your real certificate paths (certbot sets these
    # automatically for you).
    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # The API only carries small JSON payloads.
    client_max_body_size 32k;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 75s;
    }

    # Built React client (served by Express, but static assets could
    # also be served by Nginx directly — Express serving is fine).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
